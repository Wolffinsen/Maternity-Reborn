<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle | Maternity Reborn</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body class="detail-page">
  <nav class="navbar">
    <div class="navbar-inner">
      <a class="nav-logo" href="index.html" aria-label="Maternity Reborn Dolls">
        <img src="assets/img/logotipo%20transparente.png" alt="Maternity Reborn Dolls logo">
        <span>Maternity Reborn</span>
      </a>
      <a class="nav-cta" href="index.html#catalogo">Volver al catálogo</a>
    </div>
  </nav>

  <main class="detail-main" id="detalle">
    <div class="detail-layout">
      <section class="detail-gallery" aria-label="Galería del bebé">
        <div class="detail-gallery-main"><img id="detail-main-image" src="" alt=""></div>
        <div class="detail-thumbs" id="detail-thumbs"></div>
      </section>
      <section class="detail-info">
        <p class="eyebrow"><i></i><span id="detail-status"></span></p>
        <p class="detail-code" id="detail-code"></p>
        <div class="detail-badges" id="detail-badges"></div>
        <h1 class="detail-name" id="detail-name"></h1>
        <p class="detail-sub" id="detail-sub"></p>
        <p class="detail-price" id="detail-price"></p>
        <p class="detail-copy">Una pieza única, terminada a mano y preparada con el cuidado que merece su nueva familia.</p>
        <dl class="detail-specs" id="detail-specs"></dl>

        <section class="detail-section">
          <div class="detail-section-header">
            <span aria-hidden="true">✓</span>
            <h2>Certificación</h2>
          </div>
          <div id="detail-certificacion" class="detail-certificacion"></div>
        </section>

        <section class="detail-section">
          <div class="detail-section-header">
            <span aria-hidden="true">♥</span>
            <h2>Cuidados del bebé</h2>
          </div>
          <ul id="detail-cuidados" class="detail-cuidados"></ul>
        </section>

        <a class="btn-primary" href="index.html#catalogo">Solicitar este bebé</a>
      </section>
    </div>
  </main>

  <script src="assets/js/datos.js"></script>
  <script src="assets/js/detalle.js"></script>
</body>
</html>
